<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVM Command Center — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1E33;
    --bg-grid: rgba(255,255,255,0.055);
    --panel:#152944;
    --panel-2:#1C3352;
    --line:rgba(255,255,255,0.10);
    --text:#EAF0F7;
    --muted:#8FA3BE;
    --amber:#E8B34D;
    --teal:#4FB286;
    --rust:#E2664B;
    --cyan:#5EC8E0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Space Grotesk', sans-serif;
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0/32px 32px,
      var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:660px;
  }
  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .masthead h1{
    font-size:20px;
    margin:0 0 4px;
    font-weight:700;
    letter-spacing:0.2px;
  }
  .masthead p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
  }
  #resetBtn{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  #resetBtn:hover{ border-color:var(--rust); color:var(--rust); }

  /* Critical path progress track */
  .track-scroll{
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:18px;
  }
  .track{
    display:flex;
    align-items:center;
    position:relative;
    min-width:min-content;
  }
  .node-wrap{
    display:flex;
    align-items:center;
    flex:0 0 auto;
  }
  .node{
    width:26px; height:26px;
    border-radius:5px;
    border:2px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    flex:0 0 auto;
    transition:all .25s ease;
  }
  .node.current{ border-color:var(--amber); color:var(--amber); box-shadow:0 0 0 3px rgba(232,179,77,0.15); }
  .node.correct{ background:var(--teal); border-color:var(--teal); color:#0F1E33; }
  .node.wrong{ background:var(--rust); border-color:var(--rust); color:#0F1E33; }
  .connector{
    width:14px; height:2px;
    background:var(--line);
    flex:0 0 auto;
  }
  .connector.done{ background:var(--teal); }

  .statline{
    display:flex;
    gap:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    margin-bottom:16px;
  }
  .statline b{ color:var(--text); }

  /* Question card */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
  }
  .qtag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--amber);
    letter-spacing:0.5px;
    margin-bottom:10px;
  }
  .qtext{
    font-size:17px;
    line-height:1.5;
    font-weight:500;
    margin-bottom:20px;
  }
  .qtext .fx{
    font-family:'IBM Plex Mono', monospace;
    background:var(--panel-2);
    padding:1px 6px;
    border-radius:4px;
    font-size:15px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:9px;
    margin-bottom:18px;
  }
  .opt{
    text-align:left;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    padding:12px 14px;
    border-radius:8px;
    font-family:'Space Grotesk', sans-serif;
    font-size:14.5px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt:hover:not(:disabled){ border-color:var(--cyan); }
  .opt.selected-correct{ border-color:var(--teal); background:rgba(79,178,134,0.15); }
  .opt.selected-wrong{ border-color:var(--rust); background:rgba(226,102,75,0.15); }
  .opt.reveal-correct{ border-color:var(--teal); background:rgba(79,178,134,0.15); }
  .opt:disabled{ cursor:default; opacity:0.85; }

  .hint-box{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--amber);
    background:rgba(232,179,77,0.08);
    border:1px dashed rgba(232,179,77,0.4);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
    display:none;
  }
  .hint-box.show{ display:block; }

  .explain{
    font-size:13.5px;
    line-height:1.55;
    color:var(--muted);
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:18px;
    display:none;
  }
  .explain.show{ display:block; }
  .explain b{ color:var(--text); }

  .controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .left-controls{ display:flex; gap:8px; }
  button.action{
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button.action:hover:not(:disabled){ border-color:var(--cyan); }
  button.action:disabled{ opacity:0.35; cursor:not-allowed; }
  button.next{
    background:var(--amber);
    color:#1a1305;
    border-color:var(--amber);
  }
  button.next:hover{ opacity:0.9; }

  /* Summary screen */
  .summary{ text-align:center; padding:10px 0 4px; }
  .summary .big{
    font-family:'IBM Plex Mono', monospace;
    font-size:44px;
    font-weight:600;
    color:var(--amber);
    margin:6px 0 2px;
  }
  .summary p.lead{ color:var(--muted); font-size:13.5px; margin-bottom:22px; }
  .tips{
    text-align:left;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:20px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--text);
  }
  .tips h3{ margin:0 0 8px; font-size:13px; color:var(--amber); font-family:'IBM Plex Mono', monospace; }
  .tips ul{ margin:0; padding-left:18px; color:var(--muted); }
  .tips li{ margin-bottom:8px; }
  .tips li b{ color:var(--text); }
  .again-btn{
    display:block;
    width:100%;
    padding:13px;
    background:var(--teal);
    color:#0a1f17;
    border:none;
    border-radius:8px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .again-btn:hover{ opacity:0.9; }

  @media (max-width:480px){
    .card{ padding:18px; }
    .qtext{ font-size:15.5px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div>
      <h1>EVM Command Center</h1>
      <p>Earned Value Management — 15 tasks on the critical path</p>
    </div>
    <button id="resetBtn" onclick="resetQuiz()">↺ Reset</button>
  </div>

  <div class="track-scroll">
    <div class="track" id="track"></div>
  </div>

  <div class="statline">
    <span>Score: <b id="scoreText">0/15</b></span>
    <span>Hints left: <b id="hintText">3</b></span>
  </div>

  <div class="card" id="quizCard"></div>
</div>

<script>
const QUESTIONS = [
  {
    tag: "DEFINITION",
    q: "What does <span class='fx'>EV</span> (Earned Value) represent?",
    options: [
      "Money you planned to spend by now",
      "The monetary value of work actually completed",
      "Money you actually spent",
      "The total project budget"
    ],
    correct: 1,
    hint: "EV = Total Task Budget × % Completed.",
    explain: "<b>EV</b> is the money-value of the work you've genuinely finished — not what you spent, and not what you planned."
  },
  {
    tag: "DEFINITION",
    q: "What does <span class='fx'>AC</span> (Actual Cost) represent?",
    options: [
      "The value of completed work",
      "Money you were scheduled to spend by now",
      "Money you actually spent so far",
      "The total budget at completion"
    ],
    correct: 2,
    hint: "It's the real receipts — what actually came out of the wallet.",
    explain: "<b>AC</b> is real money spent to date. It doesn't care how much work got done — only what was paid out."
  },
  {
    tag: "DEFINITION",
    q: "What does <span class='fx'>PV</span> (Planned Value) represent?",
    options: [
      "Money actually spent",
      "The budgeted cost of work scheduled up to date",
      "The value of finished work",
      "The forecasted final cost"
    ],
    correct: 1,
    hint: "PV is what the schedule says you SHOULD have spent by now — no actuals involved.",
    explain: "<b>PV</b> is a pure planning number: what the baseline expected you to have spent, based on the calendar, not on what really happened."
  },
  {
    tag: "FORMULA",
    q: "Which formula correctly calculates <span class='fx'>Cost Variance (CV)</span>?",
    options: [ "EV − PV", "EV − AC", "EV / AC", "AC − EV" ],
    correct: 1,
    hint: "CV always starts with EV first, then subtracts the money-spent number.",
    explain: "<b>CV = EV − AC.</b> It compares the value you earned against what you actually spent."
  },
  {
    tag: "INTERPRETATION",
    q: "If <span class='fx'>CV</span> comes out negative, what does that mean?",
    options: [ "Ahead of schedule", "Under budget", "Over budget", "Exactly on schedule" ],
    correct: 2,
    hint: "Negative variance is bad news — and CV is the cost one.",
    explain: "A <b>negative CV</b> means you spent more (AC) than the value you earned (EV) — you're over budget for the work done."
  },
  {
    tag: "FORMULA",
    q: "Which formula calculates <span class='fx'>Schedule Variance (SV)</span>?",
    options: [ "EV − AC", "PV − EV", "EV − PV", "EV / PV" ],
    correct: 2,
    hint: "Same 'EV minus ___' pattern as CV — just swap AC for PV.",
    explain: "<b>SV = EV − PV.</b> It compares the value you earned against the value you were scheduled to have earned by now."
  },
  {
    tag: "INTERPRETATION",
    q: "A positive <span class='fx'>SV</span> means the project is...",
    options: [ "Over budget", "Behind schedule", "Ahead of schedule", "Cost-inefficient" ],
    correct: 2,
    hint: "Positive = good news, and SV is about time, not money.",
    explain: "A <b>positive SV</b> means you've earned more value than planned by this point — you're ahead of schedule."
  },
  {
    tag: "FORMULA",
    q: "Which formula calculates the <span class='fx'>Cost Performance Index (CPI)</span>?",
    options: [ "EV / AC", "EV / PV", "AC / EV", "EV − AC" ],
    correct: 0,
    hint: "CPI is about cost efficiency — compare earned value to money spent.",
    explain: "<b>CPI = EV / AC.</b> It's a ratio, not a peso amount — it tells you value earned per peso spent."
  },
  {
    tag: "INTERPRETATION",
    q: "A CPI of <span class='fx'>0.67</span> means...",
    options: [
      "You get ₱1.67 value per ₱1 spent",
      "You get ₱0.67 value per ₱1 spent",
      "You're 67% ahead of schedule",
      "You've used 67% of the total budget"
    ],
    correct: 1,
    hint: "Read CPI as 'value earned per peso spent.'",
    explain: "Since CPI < 1, every peso spent is only returning <b>₱0.67</b> of actual value — cost-inefficient."
  },
  {
    tag: "FORMULA",
    q: "Which formula calculates the <span class='fx'>Schedule Performance Index (SPI)</span>?",
    options: [ "EV / AC", "PV / EV", "EV / PV", "AC / PV" ],
    correct: 2,
    hint: "Take the CPI formula and swap AC for PV.",
    explain: "<b>SPI = EV / PV.</b> It measures the pace of progress, not the cost of it."
  },
  {
    tag: "INTERPRETATION",
    q: "An SPI of <span class='fx'>0.80</span> means the project is progressing at...",
    options: [
      "80% of the planned pace",
      "80% of the total budget",
      "20% ahead of schedule",
      "80% cost efficiency"
    ],
    correct: 0,
    hint: "SPI is about speed, not money — think 'pace percentage.'",
    explain: "SPI 0.80 means the team is moving at <b>80% of the planned speed</b> — a schedule delay."
  },
  {
    tag: "FORMULA",
    q: "Which formula calculates <span class='fx'>Estimate at Completion (EAC)</span>?",
    options: [ "BAC × CPI", "BAC / CPI", "BAC − CV", "BAC / SPI" ],
    correct: 1,
    hint: "Divide the total original budget by how cost-efficient you've been so far.",
    explain: "<b>EAC = BAC / CPI.</b> A low CPI (inefficient spending) inflates the forecasted final cost."
  },
  {
    tag: "CALCULATION",
    q: "A task has a <span class='fx'>₱20,000</span> budget and is <span class='fx'>50%</span> complete. What is its EV?",
    options: [ "₱20,000", "₱10,000", "₱50,000", "₱4,000" ],
    correct: 1,
    hint: "EV = Total Task Budget × % Completed.",
    explain: "₱20,000 × 0.50 = <b>₱10,000</b>. That's the money-value of the work actually finished."
  },
  {
    tag: "CALCULATION",
    q: "EV = <span class='fx'>₱10,000</span> and AC = <span class='fx'>₱8,000</span>. What is the CPI, and what does it mean?",
    options: [
      "0.8 — over budget / inefficient",
      "1.25 — under budget / efficient",
      "1.25 — over budget",
      "0.8 — ahead of schedule"
    ],
    correct: 1,
    hint: "Divide EV by AC — a result above 1 is good news.",
    explain: "10,000 / 8,000 = <b>1.25</b>. Since CPI ≥ 1, the project is earning ₱1.25 of value per peso spent — under budget and efficient."
  },
  {
    tag: "SCENARIO",
    q: "BAC = <span class='fx'>₱100,000</span>, CPI = <span class='fx'>0.5</span>. What is the EAC, and what does that forecast?",
    options: [
      "₱50,000 — will finish under budget",
      "₱200,000 — forecast to cost double the original budget",
      "₱150,000 — moderate overrun",
      "₱100,000 — right on budget"
    ],
    correct: 1,
    hint: "EAC = BAC / CPI. A CPI below 1 inflates the forecast.",
    explain: "100,000 / 0.5 = <b>₱200,000</b>. At this cost-efficiency rate, the whole project is forecast to cost double the original budget."
  }
];

let current = 0;
let score = 0;
let hintsLeft = 3;
let hintUsedThisQ = false;
let answered = false;
let statuses = new Array(QUESTIONS.length).fill(null); // null | 'correct' | 'wrong'

function buildTrack(){
  const track = document.getElementById('track');
  track.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const nodeWrap = document.createElement('div');
    nodeWrap.className = 'node-wrap';
    const node = document.createElement('div');
    node.className = 'node';
    node.id = 'node-' + i;
    node.textContent = i + 1;
    nodeWrap.appendChild(node);
    if(i < QUESTIONS.length - 1){
      const conn = document.createElement('div');
      conn.className = 'connector';
      conn.id = 'conn-' + i;
      nodeWrap.appendChild(conn);
    }
    track.appendChild(nodeWrap);
  });
  updateTrack();
}

function updateTrack(){
  QUESTIONS.forEach((_, i) => {
    const node = document.getElementById('node-' + i);
    node.classList.remove('current','correct','wrong');
    if(statuses[i] === 'correct') node.classList.add('correct');
    else if(statuses[i] === 'wrong') node.classList.add('wrong');
    else if(i === current) node.classList.add('current');

    if(i < QUESTIONS.length - 1){
      const conn = document.getElementById('conn-' + i);
      if(statuses[i] !== null) conn.classList.add('done');
      else conn.classList.remove('done');
    }
  });
}

function updateStats(){
  document.getElementById('scoreText').textContent = score + '/' + QUESTIONS.length;
  document.getElementById('hintText').textContent = hintsLeft;
}

function renderQuestion(){
  hintUsedThisQ = false;
  answered = false;
  const card = document.getElementById('quizCard');
  const item = QUESTIONS[current];

  let optsHtml = '';
  item.options.forEach((opt, i) => {
    optsHtml += `<button class="opt" data-idx="${i}" onclick="selectOption(${i})">${opt}</button>`;
  });

  card.innerHTML = `
    <div class="qtag">TASK ${current + 1} / ${QUESTIONS.length} — ${item.tag}</div>
    <div class="qtext">${item.q}</div>
    <div class="options" id="optionsWrap">${optsHtml}</div>
    <div class="hint-box" id="hintBox"></div>
    <div class="explain" id="explainBox"></div>
    <div class="controls">
      <div class="left-controls">
        <button class="action" id="hintBtn" onclick="useHint()">💡 Hint</button>
        <button class="action" id="revealBtn" onclick="revealAnswer()">👁 Reveal</button>
      </div>
      <button class="action next" id="nextBtn" onclick="nextQuestion()" disabled>
        ${current === QUESTIONS.length - 1 ? 'Finish →' : 'Next task →'}
      </button>
    </div>
  `;

  if(hintsLeft <= 0) document.getElementById('hintBtn').disabled = true;
  updateTrack();
  updateStats();
}

function lockOptions(){
  document.querySelectorAll('.opt').forEach(btn => btn.disabled = true);
  document.getElementById('hintBtn').disabled = true;
  document.getElementById('revealBtn').disabled = true;
  document.getElementById('nextBtn').disabled = false;
}

function showExplain(){
  const box = document.getElementById('explainBox');
  box.innerHTML = QUESTIONS[current].explain;
  box.classList.add('show');
}

function selectOption(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[current];
  const buttons = document.querySelectorAll('.opt');

  if(i === item.correct){
    buttons[i].classList.add('selected-correct');
    score++;
    statuses[current] = 'correct';
  } else {
    buttons[i].classList.add('selected-wrong');
    buttons[item.correct].classList.add('reveal-correct');
    statuses[current] = 'wrong';
  }

  lockOptions();
  showExplain();
  updateStats();
  updateTrack();
}

function useHint(){
  if(hintsLeft <= 0 || answered || hintUsedThisQ) return;
  hintUsedThisQ = true;
  hintsLeft--;
  const box = document.getElementById('hintBox');
  box.textContent = '💡 ' + QUESTIONS[current].hint;
  box.classList.add('show');
  updateStats();
  if(hintsLeft <= 0) document.getElementById('hintBtn').disabled = true;
}

function revealAnswer(){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[current];
  const buttons = document.querySelectorAll('.opt');
  buttons[item.correct].classList.add('reveal-correct');
  statuses[current] = 'wrong'; // revealed, not scored as correct
  lockOptions();
  showExplain();
  updateTrack();
}

function nextQuestion(){
  if(current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    renderSummary();
  }
}

function renderSummary(){
  const card = document.getElementById('quizCard');
  const pct = Math.round((score / QUESTIONS.length) * 100);
  let msg = "Solid grasp — a couple more passes and it'll be automatic.";
  if(pct === 100) msg = "Full marks. You know EVM cold.";
  else if(pct >= 80) msg = "Strong! Just review the ones you missed.";
  else if(pct < 50) msg = "Worth another run — the pattern gets easier each time.";

  card.innerHTML = `
    <div class="summary">
      <div class="qtag" style="text-align:center;">PROJECT CLOSED OUT</div>
      <div class="big">${score}/${QUESTIONS.length}</div>
      <p class="lead">${msg}</p>
      <div class="tips">
        <h3>THREE THINGS TO REMEMBER</h3>
        <ul>
          <li><b>EV goes first.</b> Both variances start with EV: EV − AC (cost) and EV − PV (schedule). Never the other way around.</li>
          <li><b>AC pairs with cost, PV pairs with schedule.</b> CV and CPI both use AC. SV and SPI both use PV. Same shape, different partner.</li>
          <li><b>Variance vs. Index.</b> Subtraction (CV, SV): negative is bad. Division (CPI, SPI): below 1.0 is bad.</li>
        </ul>
      </div>
      <button class="again-btn" onclick="resetQuiz()">↺ Run it again</button>
    </div>
  `;
  updateTrack();
}

function resetQuiz(){
  current = 0;
  score = 0;
  hintsLeft = 3;
  statuses = new Array(QUESTIONS.length).fill(null);
  buildTrack();
  renderQuestion();
}

buildTrack();
renderQuestion();
</script>

</body>
</html>
