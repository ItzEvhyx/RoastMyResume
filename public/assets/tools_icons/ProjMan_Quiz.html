<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Review — IT Project Management Quiz</title>
<style>
  :root{
    --paper:#EEF2F6;
    --grid-line:#DCE4EC;
    --card:#FFFFFF;
    --ink:#1B2A44;
    --ink-soft:#5B6B85;
    --rule:#C9D3E0;
    --blue:#2F5FA8;
    --blue-deep:#1F3F73;
    --amber:#C97F1F;
    --amber-soft:#F4E3C8;
    --green:#2E7D5B;
    --green-soft:#E1F0E8;
    --red:#C0483C;
    --red-soft:#FBE6E2;
    --shadow: 0 1px 0 rgba(27,42,68,0.06), 0 8px 24px rgba(27,42,68,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Source Serif Pro", serif;
    color:var(--ink);
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
      var(--paper);
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .sans{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

  .board{
    width:100%;
    max-width:680px;
  }

  /* ---------- Header / Sprint tracker ---------- */
  .board-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .board-head h1{
    font-size:1.5rem;
    margin:0;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--blue-deep);
  }
  .board-head .subtitle{
    margin:2px 0 0;
    font-size:0.85rem;
    color:var(--ink-soft);
    font-family: inherit;
  }
  .sprint-tag{
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size:0.75rem;
    color:var(--blue);
    background:var(--card);
    border:1px solid var(--rule);
    padding:3px 9px;
    border-radius:4px;
    white-space:nowrap;
  }
  .score-tag{
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size:0.75rem;
    color:var(--green);
  }

  /* Gantt-style progress bar */
  .gantt{
    display:flex;
    gap:3px;
    margin:14px 0 26px;
  }
  .gantt-seg{
    flex:1;
    height:8px;
    background:var(--rule);
    border-radius:2px;
    transition:background 0.25s ease;
  }
  .gantt-seg.done{ background:var(--blue); }
  .gantt-seg.current{ background:var(--amber); }

  /* ---------- Card ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:28px 28px 24px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0;
    width:5px; height:100%;
    background:var(--blue);
  }
  .card.state-correct::before{ background:var(--green); }
  .card.state-wrong::before{ background:var(--red); }

  .q-meta{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
  }
  .type-chip{
    font-family:"SFMono-Regular", Consolas, Menlo, monospace;
    font-size:0.68rem;
    padding:2px 8px;
    border-radius:3px;
    color:var(--blue-deep);
    background:var(--amber-soft);
    border:1px solid #E7CFA0;
  }
  .type-chip.mc{ background:#E4EBF6; border-color:#C4D3EB; color:var(--blue-deep); }
  .type-chip.tf{ background:#EAE4F6; border-color:#D2C4EB; color:#5B3F94; }
  .type-chip.id{ background:var(--amber-soft); border-color:#E7CFA0; color:#8A5A11; }

  .q-week{
    font-family:"SFMono-Regular", Consolas, Menlo, monospace;
    font-size:0.68rem;
    color:var(--ink-soft);
  }

  .q-text{
    font-size:1.15rem;
    line-height:1.5;
    margin:0 0 20px;
    color:var(--ink);
  }

  /* Options */
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:6px;
  }
  .opt{
    text-align:left;
    padding:12px 14px;
    border:1px solid var(--rule);
    background:#FBFCFE;
    border-radius:5px;
    font-family: inherit;
    font-size:0.98rem;
    color:var(--ink);
    cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .opt:hover:not(:disabled){
    border-color:var(--blue);
    background:#F2F6FC;
  }
  .opt:disabled{ cursor:default; }
  .opt.correct{
    background:var(--green-soft);
    border-color:var(--green);
    color:#1D5A40;
    font-weight:600;
  }
  .opt.wrong{
    background:var(--red-soft);
    border-color:var(--red);
    color:#8F2E24;
    font-weight:600;
  }
  .opt.dim{ opacity:0.55; }

  /* Identification input */
  .id-row{
    display:flex;
    gap:10px;
    margin-bottom:6px;
  }
  .id-input{
    flex:1;
    padding:12px 14px;
    border:1px solid var(--rule);
    border-radius:5px;
    font-family: inherit;
    font-size:0.98rem;
    background:#FBFCFE;
    color:var(--ink);
  }
  .id-input:focus{ outline:2px solid var(--blue); outline-offset:1px; }
  .btn{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size:0.88rem;
    font-weight:600;
    padding:10px 16px;
    border-radius:5px;
    border:1px solid transparent;
    cursor:pointer;
    transition:background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
    white-space:nowrap;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-primary:hover{ background:var(--blue-deep); }
  .btn-primary:disabled{ background:#A9BBD6; cursor:default; }

  /* Actions row */
  .actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:18px;
    gap:12px;
    flex-wrap:wrap;
  }
  .btn-hint{
    background:transparent;
    border:1px solid var(--amber);
    color:#8A5A11;
    font-size:0.82rem;
    padding:8px 12px;
  }
  .btn-hint:hover:not(:disabled){ background:var(--amber-soft); }
  .btn-hint:disabled{
    border-color:var(--rule);
    color:var(--ink-soft);
    cursor:default;
  }
  .btn-reveal{
    background:transparent;
    border:1px solid var(--rule);
    color:var(--ink-soft);
    font-size:0.82rem;
    padding:8px 12px;
  }
  .btn-reveal:hover:not(:disabled){ border-color:var(--ink-soft); color:var(--ink); }
  .btn-reveal:disabled{ opacity:0.4; cursor:default; }

  .btn-next{
    background:var(--blue);
    color:#fff;
    font-size:0.88rem;
    padding:10px 20px;
    display:none;
  }
  .btn-next.show{ display:inline-block; }

  /* Hint panel */
  .hints{
    margin-top:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .hint-line{
    font-family:inherit;
    font-size:0.9rem;
    color:#8A5A11;
    background:var(--amber-soft);
    border:1px solid #E7CFA0;
    border-left:3px solid var(--amber);
    padding:8px 12px;
    border-radius:4px;
  }

  /* Feedback / explanation */
  .feedback{
    margin-top:16px;
    padding:14px 16px;
    border-radius:5px;
    font-size:0.94rem;
    line-height:1.55;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct{ background:var(--green-soft); border:1px solid #BFE0CD; color:#1D5A40; }
  .feedback.wrong{ background:var(--red-soft); border:1px solid #EFC3BC; color:#7A281F; }
  .feedback .fb-label{ font-weight:700; margin-right:4px; }

  /* ---------- End screen ---------- */
  .end-card{ text-align:center; padding:44px 28px; }
  .end-card .big-score{
    font-size:3rem;
    font-weight:700;
    color:var(--blue-deep);
    margin:6px 0 2px;
  }
  .end-card .end-label{
    font-family:"SFMono-Regular", Consolas, Menlo, monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  .end-card .end-msg{
    margin:18px auto 26px;
    max-width:420px;
    color:var(--ink-soft);
    font-size:0.98rem;
    line-height:1.6;
  }
  .end-actions{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .btn-reset{
    background:var(--blue);
    color:#fff;
    font-size:0.95rem;
    padding:13px 26px;
  }
  .btn-reset:hover{ background:var(--blue-deep); }
  .btn-retake{
    background:transparent;
    color:#8A5A11;
    border:1px solid var(--amber);
    font-size:0.95rem;
    padding:13px 26px;
  }
  .btn-retake:hover{ background:var(--amber-soft); }

  /* Utility */
  .hidden{ display:none !important; }

  footer.note{
    text-align:center;
    margin-top:22px;
    font-size:0.75rem;
    color:var(--ink-soft);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  @media (max-width:480px){
    .card{ padding:22px 18px 20px; }
    .q-text{ font-size:1.05rem; }
    .id-row{ flex-direction:column; }
    .board-head h1{ font-size:1.25rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="board">
  <div class="board-head">
    <div>
      <h1>Sprint Review</h1>
      <p class="subtitle">IT Project Management · Weeks 2–7 reviewer quiz</p>
    </div>
    <div style="text-align:right;">
      <div class="sprint-tag" id="sprintTag">Item 1 / 30</div>
      <div class="score-tag" id="scoreTag" style="margin-top:4px;">Score 0</div>
    </div>
  </div>

  <div class="gantt" id="ganttBar"></div>

  <div id="quizArea"></div>

  <footer class="note">Hints cost nothing but your pride. Wrong answers still show you the right one.</footer>
</div>

<script>
/* =========================================================
   QUESTION BANK — 50 items pulled from the IT PM reviewer
   type: "mc" | "tf" | "id"
   ========================================================= */
const BANK = [
  // ---------- WEEK 2 ----------
  {week:"W2", type:"mc", q:"Per the PMBOK Guide (7th Edition), project management is best defined as:",
    options:["The application of knowledge, skills, tools, and techniques to project activities to meet project requirements","The act of assigning tasks to a development team","A method for tracking company expenses","A framework exclusive to software companies"],
    answer:"The application of knowledge, skills, tools, and techniques to project activities to meet project requirements",
    explanation:"This is the PMBOK Guide (7th Edition) definition quoted directly in the Week 2 overview.",
    hints:["Look at the very first definition in the Week 2 section.","It's the PMBOK Guide's official wording, not Portny's.","It starts with 'The application of knowledge, skills, tools, and techniques...'"]},

  {week:"W2", type:"id", q:"Identify the term: the uncontrolled expansion of project scope without corresponding adjustments to time, cost, or resources.",
    acceptable:["scope creep"],
    explanation:"Scope Creep is listed as a major IT project challenge — unapproved feature growth that inflates budgets and delays timelines.",
    hints:["It's one of the 'Major Challenges' listed in Week 2.","It also reappears in Week 5 as something Scope Management prevents.","Two words, starts with 'Scope...'"]},

  {week:"W2", type:"tf", q:"True or False: The Project Management Institute (PMI) is a for-profit corporation.",
    options:["True","False"], answer:"False",
    explanation:"PMI is described as a globally recognized professional non-profit organization that sets standards like PMP and CAPM.",
    hints:["Re-read the PMI definition in Week 2, section 4.","It's described with a specific tax-status word.","The reviewer explicitly says 'non-profit'."]},

  {week:"W2", type:"mc", q:"Which IT project role gathers, formalizes, and translates business requirements into technical specifications?",
    options:["System Analyst","QA Tester","Network / Infra Engineer","UI/UX Designer"],
    answer:"System Analyst",
    explanation:"The System Analyst gathers and formalizes business requirements into precise technical specs and performs feasibility analyses.",
    hints:["It's in the Key Roles table, second row.","This role also performs feasibility analyses.","Not a developer, not a designer — an 'analyst'."]},

  {week:"W2", type:"id", q:"Which author defines project management as 'a structured approach to planning, executing, monitoring, and closing temporary efforts to deliver a unique product or service'?",
    acceptable:["portny","portny 2020","s. e. portny","s.e. portny"],
    explanation:"This is Portny's (2020) definition, distinct from the PMBOK Guide's definition quoted right above it.",
    hints:["Two definitions are quoted in Week 2 — this is the second one.","Check the References list for a 2020 'All-in-One for Dummies' author.","Last name starts with 'P'."]},

  {week:"W2", type:"mc", q:"Which PMBOK Guide (7th Ed.) Performance Domain focuses on evaluating performance against baselines using metrics?",
    options:["Measurement","Delivery","Planning","Uncertainty"],
    answer:"Measurement",
    explanation:"The Measurement domain covers evaluating performance against baselines using metrics, per the 8 performance domains listed.",
    hints:["It's one of 8 performance domains listed under Standards & Governance.","Think about what metrics and baselines relate to.","The domain's name literally matches 'evaluating performance'."]},

  {week:"W2", type:"tf", q:"True or False: Agile and DevOps are cited as examples of adaptive planning frameworks that IT projects integrate to match technical dynamism.",
    options:["True","False"], answer:"True",
    explanation:"'Adaptive Planning Needs' explicitly names Agile and DevOps as frameworks enabling flexibility in IT projects.",
    hints:["Check the 'Importance of Project Management in IT' bullet list.","One bullet is titled 'Adaptive Planning Needs'.","It names two specific frameworks by name."]},

  {week:"W2", type:"mc", q:"Which role manages system deployment, hardware provisioning, cloud infrastructure setup, and network protocols?",
    options:["Network / Infra Engineers","Developers / Programmers","Project Manager","Stakeholders"],
    answer:"Network / Infra Engineers",
    explanation:"This role is defined in the roles table as managing deployment, hardware, cloud infrastructure, and network configuration.",
    hints:["It's the second-to-last row in the roles table.","The role name includes the word 'Infra'.","Think servers, networks, and environments — not code."]},

  {week:"W2", type:"id", q:"Identify the 2019 research (Tabassi et al.) that highlights 18 main challenges across 125 parameters in modern project management.",
    acceptable:["21st century pm research","challenges for project management in the 21st century","tabassi"],
    explanation:"Tabassi et al. (2019) is cited for identifying 18 challenges across 125 parameters and stressing soft-skills gaps in traditional PM.",
    hints:["It's cited right after the 'Major Challenges' bullet list in Week 2.","The author's surname is also in the References list.","Look for '21st Century PM Research'."]},

  {week:"W2", type:"tf", q:"True or False: Poor communication in IT projects refers specifically to a disconnect between technical delivery teams and non-technical business stakeholders.",
    options:["True","False"], answer:"True",
    explanation:"'Poor Communication' is defined exactly this way among the Major Challenges in Week 2.",
    hints:["It's the second bullet under Major Challenges.","It's about a gap between two different groups.","One group is technical, the other is business-facing."]},

  // ---------- WEEK 3 ----------
  {week:"W3", type:"id", q:"Identify the term: the sequential and overlapping phases a project traverses from inception to final completion.",
    acceptable:["it project lifecycle","project lifecycle"],
    explanation:"This is the IT Project Lifecycle, tailored to project size and complexity per Nizhebetskyi (2022).",
    hints:["It's the heading of Week 3, section 1.","It's tailored specifically to project size and complexity.","Two words: 'Project ______'."]},

  {week:"W3", type:"mc", q:"Which lifecycle phase involves defining objectives, evaluating feasibility, and securing formal approval?",
    options:["Initiation","Planning","Execution","Closure"],
    answer:"Initiation",
    explanation:"Initiation is the first lifecycle phase: define objectives, evaluate feasibility, identify stakeholders, secure approval.",
    hints:["It's the very first row of the lifecycle table.","This phase happens before any budget is allocated.","It literally means 'starting' the project."]},

  {week:"W3", type:"mc", q:"Which lifecycle phase tracks KPIs, verifies quality standards, and manages schedule variance?",
    options:["Monitoring & Control","Execution","Planning","Initiation"],
    answer:"Monitoring & Control",
    explanation:"This phase covers tracking KPIs, verifying quality, managing schedule variance, and processing changes.",
    hints:["It's the fourth row of the lifecycle table.","Two words joined by an ampersand.","Think about ongoing oversight, not building or approving."]},

  {week:"W3", type:"tf", q:"True or False: The Waterfall methodology offers high flexibility, easily accommodating midstream changes.",
    options:["True","False"], answer:"False",
    explanation:"Waterfall has LOW flexibility — changes midstream are described as costly and difficult.",
    hints:["Check the Flexibility row of the comparison table.","Waterfall is linear and sequential with gated phases.","Agile is the one described as 'High' flexibility, not Waterfall."]},

  {week:"W3", type:"mc", q:"Which methodology is described as having a 'Continuous' feedback loop through regular demos and sprint reviews?",
    options:["Agile Approach","Traditional (Waterfall)","Hybrid Methodology","None of the above"],
    answer:"Agile Approach",
    explanation:"Agile's feedback loop is 'Continuous: Regular demos and sprint reviews,' unlike Waterfall's late feedback.",
    hints:["Look at the Feedback Loop row in the comparison table.","Waterfall's feedback loop is labeled 'Late'.","This methodology uses sprints."]},

  {week:"W3", type:"id", q:"Identify the lightweight Agile framework for delivering products in 2–4 week timeboxed iterations called Sprints.",
    acceptable:["scrum"],
    explanation:"Scrum (Schmidt, 2021) is the lightweight Agile framework built around timeboxed Sprints.",
    hints:["It's the heading of Week 3, section 3.","Its ceremonies include Daily Stand-ups and Retrospectives.","One word, five letters."]},

  {week:"W3", type:"mc", q:"Which Scrum role represents business value, defines User Stories, and maintains the Product Backlog?",
    options:["Product Owner","Scrum Master","Development Team","Project Sponsor"],
    answer:"Product Owner",
    explanation:"The Product Owner represents business value, defines User Stories, and manages the Product Backlog and stakeholder expectations.",
    hints:["It's the first of the three Core Scrum Roles.","This role prioritizes what goes into the backlog.","Not the facilitator — the one who 'owns' the product vision."]},

  {week:"W3", type:"mc", q:"Which Scrum role acts as a process facilitator and servant-leader who removes organizational blockers?",
    options:["Scrum Master","Product Owner","Development Team","Stakeholder"],
    answer:"Scrum Master",
    explanation:"The Scrum Master is the servant-leader who removes blockers, enforces Scrum rules, and shields the team.",
    hints:["It's the second of the three Core Scrum Roles.","This role 'shields the team' from distractions.","Their title includes the framework's name."]},

  {week:"W3", type:"id", q:"Identify the Scrum ceremony: a brief daily 15-minute synchronization meeting to discuss progress and impediments.",
    acceptable:["daily scrum","stand-up","standup","daily scrum (stand-up)","daily stand-up"],
    explanation:"The Daily Scrum (Stand-up) is the brief daily 15-minute sync meeting on progress and blockers.",
    hints:["It's the second of the four Key Scrum Events.","It happens every single day, not once per sprint.","People often do this one standing up."]},

  {week:"W3", type:"mc", q:"Which Scrum event is a post-sprint internal team evaluation focused on continuous process improvement?",
    options:["Sprint Retrospective","Sprint Review","Sprint Planning","Daily Scrum"],
    answer:"Sprint Retrospective",
    explanation:"The Sprint Retrospective is the internal team evaluation for continuous improvement, distinct from the stakeholder-facing Sprint Review.",
    hints:["It's the last of the four Key Scrum Events listed.","It's internal to the team, not shown to stakeholders.","Compare it to 'Sprint Review', which demos to stakeholders instead."]},

  {week:"W3", type:"tf", q:"True or False: The Hybrid Methodology's documentation level is described as 'Extensive', identical to Waterfall.",
    options:["True","False"], answer:"False",
    explanation:"Hybrid's documentation is 'Moderate: Standard compliance docs with lean execution logs' — Waterfall's is the 'Extensive' one.",
    hints:["Check the Documentation row of the comparison table.","Waterfall is the one labeled 'Extensive'.","Hybrid sits in between Waterfall and Agile."]},

  {week:"W3", type:"tf", q:"True or False: Waterfall delivers value only at the end of the project timeline.",
    options:["True","False"], answer:"True",
    explanation:"Waterfall's Delivery Speed is 'Slower: Value delivered only at end of timeline,' per the comparison table.",
    hints:["Check the Delivery Speed row of the comparison table.","This is the opposite of Agile's 'Fast' frequent releases.","Waterfall is linear, so nothing ships until the end."]},

  // ---------- WEEK 4 ----------
  {week:"W4", type:"id", q:"Identify the term: coordinating all project elements — scope, time, cost, quality, resources, and communications — to ensure unified execution.",
    acceptable:["project integration management","integration management"],
    explanation:"Portny (2020) defines Project Integration Management this way, calling it the coordination of all project elements.",
    hints:["It's the heading of Week 4, section 1.","Nizhebetskyi calls it the project's 'strategic glue'.","Two words: 'Project ______ Management'."]},

  {week:"W4", type:"id", q:"Fill in the term Nizhebetskyi (2022) uses to describe Integration Management's role in keeping projects aligned with business purpose: the '________' keeping projects from siloed execution.",
    acceptable:["strategic glue"],
    explanation:"Nizhebetskyi (2022) calls integration the 'strategic glue' that prevents siloed execution across functional units.",
    hints:["It's a two-word metaphor describing adhesion or bonding.","Think of something that holds separate pieces together.","It's not literal glue — it's 'strategic' glue."]},

  {week:"W4", type:"mc", q:"Which Integration Management process formally authorizes a project and gives authority to the PM?",
    options:["Develop Project Charter","Develop Project Management Plan","Direct and Manage Project Work","Close Project or Phase"],
    answer:"Develop Project Charter",
    explanation:"'Develop Project Charter' is the process that formally authorizes the project and grants the PM authority.",
    hints:["It's the first of the six Integration Management processes.","This is also the deliverable described further in section 3.","It contains the word 'Charter'."]},

  {week:"W4", type:"tf", q:"True or False: Schmidt (2021) describes project initiation as the 'decision-making gateway.'",
    options:["True","False"], answer:"True",
    explanation:"The reviewer directly attributes this description of initiation to Schmidt (2021).",
    hints:["Check the opening sentence of Week 4, section 2.","It's a specific quoted phrase, not a paraphrase.","The phrase includes the word 'gateway'."]},

  {week:"W4", type:"id", q:"Identify the document that justifies why a project is important and what value it delivers, developed during initiation.",
    acceptable:["business case"],
    explanation:"Business Case Development justifies the project's importance and value as an essential initiation activity.",
    hints:["It's the first of the four Essential Initiation Activities.","It answers the question 'why does this project matter?'","Two words, the second being 'Case'."]},

  {week:"W4", type:"mc", q:"Which of these is NOT listed as an essential initiation activity?",
    options:["Cost baseline development","Business Case Development","Feasibility Assessment","Stakeholder Identification"],
    answer:"Cost baseline development",
    explanation:"The four essential initiation activities are Business Case, Feasibility Assessment, Stakeholder ID, and Charter Creation — cost baselining belongs to Cost Management, not Initiation.",
    hints:["Three of the four options appear verbatim in Week 4, section 2.","The odd one out is actually a Week 7 (Cost Management) concept.","Look for the option about budgets, not approvals."]},

  {week:"W4", type:"mc", q:"Which Project Charter component includes SMART goals such as 'Launch by Q4 2026; achieve 95% user satisfaction'?",
    options:["Objectives & Success Criteria","Purpose / Justification","High-Level Requirements","Summary Milestone Schedule"],
    answer:"Objectives & Success Criteria",
    explanation:"This charter component is defined as containing SMART goals like the launch date and satisfaction target example.",
    hints:["It's the third row of the Project Charter Components table.","'SMART' is the keyword used to describe this component.","It pairs goals with measurable success criteria."]},

  {week:"W4", type:"id", q:"Identify the Project Charter component describing operational parameters like 'Users have internet access' and 'Limited training time.'",
    acceptable:["assumptions & constraints","assumptions and constraints","assumptions/constraints"],
    explanation:"'Assumptions & Constraints' captures operational parameters like assumed conditions and known limitations.",
    hints:["It's the second-to-last row of the Project Charter Components table.","It has two paired concepts joined by 'and'.","One term describes what you assume; the other, what limits you."]},

  {week:"W4", type:"tf", q:"True or False: 'Feasibility Assessment' evaluates the technical, financial, and logistical viability of a project.",
    options:["True","False"], answer:"True",
    explanation:"Feasibility Assessment is defined exactly this way among the Essential Initiation Activities.",

/* =========================================================
   STATE
   ========================================================= */
const DEFAULT_ROUND_SIZE = 30;
const MAX_HINTS = 3;

// Give every bank question a stable id (its index) so missed items
// can be tracked and looked back up across rounds/shuffles.
BANK.forEach((q, i) => { q.id = i; });

let ROUND_SIZE = DEFAULT_ROUND_SIZE;
let roundQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let hintsLeft = MAX_HINTS;
let revealedHints = [];
let isRetakeRound = false;
let currentMissedIds = new Set();

const quizArea = document.getElementById("quizArea");
const sprintTag = document.getElementById("sprintTag");
const scoreTag = document.getElementById("scoreTag");
const ganttBar = document.getElementById("ganttBar");

/* Fisher-Yates shuffle */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(str){
  return str
    .toLowerCase()
    .trim()
    .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, m => (m === "-" ? " " : ""))
    .replace(/\s+/g, " ")
    .trim();
}

function buildRound(){
  isRetakeRound = false;
  ROUND_SIZE = DEFAULT_ROUND_SIZE;
  startRound(shuffle(BANK).slice(0, ROUND_SIZE));
}

function buildRetakeRound(){
  if(currentMissedIds.size === 0) return;
  const source = Array.from(currentMissedIds).map(id => BANK[id]);
  isRetakeRound = true;
  ROUND_SIZE = source.length;
  startRound(shuffle(source));
}

function startRound(sourceQuestions){
  roundQuestions = sourceQuestions.map(q => {
    const clone = JSON.parse(JSON.stringify(q));
    if(clone.type === "mc"){
      clone.options = shuffle(clone.options);
    }
    return clone;
  });
  currentIndex = 0;
  score = 0;
  currentMissedIds = new Set();
  buildGantt();
  renderQuestion();
}

function buildGantt(){
  ganttBar.innerHTML = "";
  for(let i = 0; i < ROUND_SIZE; i++){
    const seg = document.createElement("div");
    seg.className = "gantt-seg";
    seg.id = "seg-" + i;
    ganttBar.appendChild(seg);
  }
}

function updateGantt(){
  for(let i = 0; i < ROUND_SIZE; i++){
    const seg = document.getElementById("seg-" + i);
    if(!seg) continue;
    seg.classList.remove("done", "current");
    if(i < currentIndex) seg.classList.add("done");
    else if(i === currentIndex) seg.classList.add("current");
  }
}

function updateHeader(){
  sprintTag.textContent = `Item ${Math.min(currentIndex + 1, ROUND_SIZE)} / ${ROUND_SIZE}`;
  scoreTag.textContent = `Score ${score}`;
}

const TYPE_LABEL = { mc: "Multiple Choice", tf: "True / False", id: "Identification" };

function renderQuestion(){
  if(currentIndex >= roundQuestions.length){
    renderEndScreen();
    return;
  }
  answered = false;
  hintsLeft = MAX_HINTS;
  revealedHints = [];
  updateHeader();
  updateGantt();

  const q = roundQuestions[currentIndex];

  const card = document.createElement("div");
  card.className = "card";
  card.id = "activeCard";

  const meta = document.createElement("div");
  meta.className = "q-meta";
  meta.innerHTML = `
    <span class="type-chip ${q.type}">${TYPE_LABEL[q.type]}</span>
    <span class="q-week">Week ${q.week.replace('W','')}</span>
  `;
  card.appendChild(meta);

  const qText = document.createElement("p");
  qText.className = "q-text";
  qText.textContent = q.q;
  card.appendChild(qText);

  if(q.type === "mc" || q.type === "tf"){
    const optsWrap = document.createElement("div");
    optsWrap.className = "options";
    q.options.forEach(optText => {
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.type = "button";
      btn.textContent = optText;
      btn.addEventListener("click", () => handleChoice(optText, btn, optsWrap, q));
      optsWrap.appendChild(btn);
    });
    card.appendChild(optsWrap);
  } else if(q.type === "id"){
    const idRow = document.createElement("div");
    idRow.className = "id-row";
    const input = document.createElement("input");
    input.className = "id-input";
    input.type = "text";
    input.placeholder = "Type your answer…";
    input.id = "idInput";
    input.addEventListener("keydown", e => {
      if(e.key === "Enter" && !answered) handleIdSubmit(q);
    });
    const submitBtn = document.createElement("button");
    submitBtn.className = "btn btn-primary";
    submitBtn.textContent = "Submit";
    submitBtn.id = "idSubmit";
    submitBtn.addEventListener("click", () => handleIdSubmit(q));
    idRow.appendChild(input);
    idRow.appendChild(submitBtn);
    card.appendChild(idRow);
  }

  // hints panel
  const hintsPanel = document.createElement("div");
  hintsPanel.className = "hints";
  hintsPanel.id = "hintsPanel";
  card.appendChild(hintsPanel);

  // feedback
  const feedback = document.createElement("div");
  feedback.className = "feedback";
  feedback.id = "feedbackPanel";
  card.appendChild(feedback);

  // actions row
  const actions = document.createElement("div");
  actions.className = "actions";

  const leftActions = document.createElement("div");
  leftActions.style.display = "flex";
  leftActions.style.gap = "8px";
  leftActions.style.flexWrap = "wrap";

  const hintBtn = document.createElement("button");
  hintBtn.className = "btn btn-hint";
  hintBtn.id = "hintBtn";
  hintBtn.textContent = `Ask the PM for a hint (${hintsLeft} left)`;
  hintBtn.addEventListener("click", () => useHint(q));
  leftActions.appendChild(hintBtn);

  const revealBtn = document.createElement("button");
  revealBtn.className = "btn btn-reveal";
  revealBtn.id = "revealBtn";
  revealBtn.textContent = "Reveal answer";
  revealBtn.addEventListener("click", () => revealAnswer(q));
  leftActions.appendChild(revealBtn);

  actions.appendChild(leftActions);

  const nextBtn = document.createElement("button");
  nextBtn.className = "btn btn-next";
  nextBtn.id = "nextBtn";
  nextBtn.textContent = currentIndex === roundQuestions.length - 1 ? "See results" : "Next item →";
  nextBtn.addEventListener("click", () => {
    currentIndex++;
    renderQuestion();
  });
  actions.appendChild(nextBtn);

  card.appendChild(actions);

  quizArea.innerHTML = "";
  quizArea.appendChild(card);
}

function useHint(q){
  if(hintsLeft <= 0 || answered) return;
  const nextHintIndex = MAX_HINTS - hintsLeft;
  revealedHints.push(q.hints[nextHintIndex]);
  hintsLeft--;
  const panel = document.getElementById("hintsPanel");
  const line = document.createElement("div");
  line.className = "hint-line";
  line.textContent = `Hint ${nextHintIndex + 1}: ${q.hints[nextHintIndex]}`;
  panel.appendChild(line);
  const hintBtn = document.getElementById("hintBtn");
  if(hintsLeft <= 0){
    hintBtn.textContent = "No hints left";
    hintBtn.disabled = true;
  } else {
    hintBtn.textContent = `Ask the PM for a hint (${hintsLeft} left)`;
  }
}

function lockOut(){
  answered = true;
  const hintBtn = document.getElementById("hintBtn");
  const revealBtn = document.getElementById("revealBtn");
  if(hintBtn) hintBtn.disabled = true;
  if(revealBtn) revealBtn.disabled = true;
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.classList.add("show");
}

function showFeedback(isCorrect, text){
  const panel = document.getElementById("feedbackPanel");
  panel.className = "feedback show " + (isCorrect ? "correct" : "wrong");
  panel.innerHTML = `<span class="fb-label">${isCorrect ? "Correct." : "Not quite."}</span>${text}`;
  const card = document.getElementById("activeCard");
  card.classList.remove("state-correct", "state-wrong");
  card.classList.add(isCorrect ? "state-correct" : "state-wrong");
}

function handleChoice(chosenText, btnEl, optsWrap, q){
  if(answered) return;
  const isCorrect = chosenText === q.answer;
  const allBtns = optsWrap.querySelectorAll(".opt");
  allBtns.forEach(b => {
    b.disabled = true;
    if(b.textContent === q.answer){
      b.classList.add("correct");
    } else if(b === btnEl && !isCorrect){
      b.classList.add("wrong");
    } else {
      b.classList.add("dim");
    }
  });
  if(isCorrect) score++;
  else currentMissedIds.add(q.id);
  showFeedback(isCorrect, q.explanation);
  lockOut();
  updateHeader();
}

function handleIdSubmit(q){
  if(answered) return;
  const input = document.getElementById("idInput");
  const val = normalize(input.value);
  if(val.length === 0){
    input.focus();
    return;
  }
  const isCorrect = q.acceptable.some(acc => {
    const na = normalize(acc);
    return val === na || val.includes(na) || na.includes(val);
  });
  input.disabled = true;
  document.getElementById("idSubmit").disabled = true;
  if(isCorrect) score++;
  else currentMissedIds.add(q.id);
  const answerLine = `The expected answer: <strong>${q.acceptable[0]}</strong>. ${q.explanation}`;
  showFeedback(isCorrect, answerLine);
  lockOut();
  updateHeader();
}

function revealAnswer(q){
  if(answered) return;
  currentMissedIds.add(q.id);
  if(q.type === "mc" || q.type === "tf"){
    const optsWrap = quizArea.querySelector(".options");
    const allBtns = optsWrap.querySelectorAll(".opt");
    allBtns.forEach(b => {
      b.disabled = true;
      if(b.textContent === q.answer) b.classList.add("correct");
      else b.classList.add("dim");
    });
  } else {
    document.getElementById("idInput").disabled = true;
    document.getElementById("idSubmit").disabled = true;
  }
  showFeedback(false, `Answer: <strong>${q.type === "id" ? q.acceptable[0] : q.answer}</strong>. ${q.explanation}`);
  const panel = document.getElementById("feedbackPanel");
  panel.className = "feedback show wrong";
  panel.querySelector(".fb-label").textContent = "Revealed —";
  lockOut();
}

function renderEndScreen(){
  updateGantt();
  sprintTag.textContent = `Sprint complete`;
  scoreTag.textContent = `Score ${score}`;

  const missedCount = currentMissedIds.size;
  const pct = Math.round((score / roundQuestions.length) * 100);
  let msg = "Solid grasp of the material — a few reviews away from mastery.";
  if(pct === 100) msg = isRetakeRound
    ? "Every missed item cleared. Nothing left in the backlog."
    : "Perfect sprint. You could run this project blindfolded.";
  else if(pct >= 80) msg = "Strong performance — you know the framework well.";
  else if(pct >= 50) msg = "Decent pass — worth another round to lock in the weak spots.";
  else msg = "Rough sprint. Reset and run it back — repetition is how this sticks.";

  const label = isRetakeRound ? "FOCUSED RETAKE" : "SPRINT RETROSPECTIVE";

  const card = document.createElement("div");
  card.className = "card end-card";
  card.innerHTML = `
    <div class="end-label">${label}</div>
    <div class="big-score">${score} / ${roundQuestions.length}</div>
    <div class="end-label">${pct}% ACCURACY</div>
    <p class="end-msg">${msg}</p>
    <div class="end-actions">
      ${missedCount > 0 ? `<button class="btn btn-retake" id="retakeBtn">Retake missed items (${missedCount})</button>` : ""}
      <button class="btn btn-reset" id="resetBtn">Reset &amp; reshuffle</button>
    </div>
  `;
  quizArea.innerHTML = "";
  quizArea.appendChild(card);

  document.getElementById("resetBtn").addEventListener("click", buildRound);
  const retakeBtn = document.getElementById("retakeBtn");
  if(retakeBtn) retakeBtn.addEventListener("click", buildRetakeRound);
}

/* init */
buildRound();
</script>
